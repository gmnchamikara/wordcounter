# application.properties (shared base properties)
spring.application.name=wordcounter

# Remove grpc.server.port (you're not using gRPC)
# Fix port conflicts by assigning unique ports via profiles (see below)
# server.port=8181 ? Remove this (set in profile-specific files instead)

# Exclude unnecessary auto-configurations
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Load balancing
spring.cloud.loadbalancer.ribbon.enabled=false

# Coordinator's endpoint (will run on 8080 via application-coordinator.properties)
coordinator.url=http://localhost:8080

# Node address template (replaced by profile-specific files)
node.address=http://localhost:${server.port}

# Document path (escape spaces or use short path)
document.path=F:/document.txt

