syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.wordcounter.grpc";
option java_outer_classname = "WordCounterProto";

service WordCounterService {
  rpc RegisterNode(NodeRegistrationRequest) returns (NodeRegistrationResponse);
  rpc ProcessLine(ProcessLineRequest) returns (ProcessLineResponse);
  rpc SubmitResults(ResultsSubmissionRequest) returns (ResultsSubmissionResponse);
}

message NodeRegistrationRequest {
  string node_type = 1;
  string address = 2;
}

message NodeRegistrationResponse {
  bool success = 1;
  string message = 2;
}

message ProcessLineRequest {
  string line = 1;
}

message ProcessLineResponse {
  bool acknowledged = 1;
}

message ResultsSubmissionRequest {
  map<string, WordCount> counts = 1;
  string proposer_address = 2;
}

message WordCount {
  int32 count = 1;
  repeated string words = 2;
}

message ResultsSubmissionResponse {
  bool accepted = 1;
  string validation_message = 2;
}